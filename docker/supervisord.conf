[supervisord]
nodaemon=true
user=root
logfile=/var/log/tgdrive/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ---------- PostgreSQL ----------
[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -p 5432
priority=10
autostart=true
autorestart=true
startsecs=5
environment=PGDATA="/data/postgres",POSTGRES_USER="teldrive",POSTGRES_PASSWORD="secret",POSTGRES_DB="postgres"
stdout_logfile=/var/log/tgdrive/postgres.log
stderr_logfile=/var/log/tgdrive/postgres.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------- Teldrive ----------
[program:teldrive]
command=/teldrive-entry.sh
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/var/log/tgdrive/teldrive.log
stderr_logfile=/var/log/tgdrive/teldrive.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
