[supervisord]
nodaemon=true
user=root
logfile=/var/log/tgdrive/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ---------- PostgreSQL ----------
#
# 【必须走 docker-entrypoint.sh，不能直接调 postgres】
# postgres 出于安全**拒绝以 root 身份运行**（报 "root" execution of the
# PostgreSQL server is not permitted）。而 supervisord 是以 root 起的，
# 直接 `command=/usr/local/bin/postgres` 会立刻 exit 1，然后无限重启 ——
# 表现就是「容器在跑、网页永久打不开」。
#
# 官方 docker-entrypoint.sh 内部会用 gosu 切到 postgres 用户再启动，
# 所以这里必须经它转一手。初始化仍然由 entrypoint.sh 负责，两边不冲突：
# docker-entrypoint.sh 看到 $PGDATA 里已有 PG_VERSION，会跳过 initdb 直接启动。
#
# startretries 必须显式写大：默认只有 3 次，失败 3 次 supervisord 就放弃
# 并标记 FATAL —— 之后**再也不会拉起**。
[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -p 5432
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=INT
stopwaitsecs=30
environment=PGDATA="/data/postgres",PGPORT="5432",POSTGRES_USER="teldrive",POSTGRES_PASSWORD="secret",POSTGRES_DB="postgres"
stdout_logfile=/var/log/tgdrive/postgres.log
stderr_logfile=/var/log/tgdrive/postgres.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------- Teldrive ----------
[program:teldrive]
command=/teldrive-entry.sh
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=100
stdout_logfile=/var/log/tgdrive/teldrive.log
stderr_logfile=/var/log/tgdrive/teldrive.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
