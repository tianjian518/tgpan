[supervisord]
nodaemon=true
user=root
logfile=/var/log/tgdrive/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ---------- PostgreSQL ----------
#
# 【为什么直接调 postgres，而不调 pgroonga 的 docker-entrypoint.sh】
# 那个官方入口脚本会：① 对整个 $PGDATA 做 find + chown（慢，且在慢盘上很痛）
# ② 自己判断要不要 initdb ③ 改 pg_hba.conf ④ 用 gosu 重启自己。
# 而我们的 entrypoint.sh **已经**做完了初始化，两套逻辑同时存在会互相打架，
# 典型表现是权限被反复改、以及启动时序错乱。
# 现在职责划清：初始化完全交给 entrypoint.sh，supervisord 只负责**常驻运行** postgres。
#
# startretries 必须显式写大：默认只有 3 次，失败 3 次 supervisord 就放弃
# 并标记 FATAL —— 之后**再也不会拉起**，容器看着在跑、网页却永久打不开。
command=/usr/local/bin/postgres -D /data/postgres -p 5432
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=INT
stopwaitsecs=30
environment=PGDATA="/data/postgres",PGPORT="5432"
stdout_logfile=/var/log/tgdrive/postgres.log
stderr_logfile=/var/log/tgdrive/postgres.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------- Teldrive ----------
[program:teldrive]
command=/teldrive-entry.sh
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=100
stdout_logfile=/var/log/tgdrive/teldrive.log
stderr_logfile=/var/log/tgdrive/teldrive.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
