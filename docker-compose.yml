services:
  tgpan:
    image: tianjian518/tgpan:latest
    container_name: tgpan
    restart: unless-stopped
    ports:
      # Web 界面：看片、管理文件、扫码登录
      - "8080:8080"
    volumes:
      # 数据库 + TG 会话 + 配置全在这里，容器重建不丢数据
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      # ================================================================
      #  【强烈建议填写】你自己的 Telegram 应用凭据
      #  在 https://my.telegram.org/apps 免费申请（用电脑浏览器打开）
      #  填上后可显著提高登录时验证码的投递成功率
      # ================================================================
      # - TELDRIVE_TG_APP_ID=1234567
      # - TELDRIVE_TG_APP_HASH=0123456789abcdef0123456789abcdef
      #
      # 可选：自定义设备身份（一般不用改）
      # - TELDRIVE_TG_DEVICE_MODEL=SM-G9980
      # - TELDRIVE_TG_SYSTEM_VERSION=SDK 34
      # - TELDRIVE_TG_APP_VERSION=11.2.0
      #
      # 设为 0 可关闭「真实设备身份」，回到原版网页版伪装行为
      # - TELDRIVE_TG_REAL_DEVICE=0
      #
      # ================================================================
      #  登录会话（Cookie）相关
      # ================================================================
      # 会话有效期，默认 30 天。想「记住登录更久」就调大，例如 365d
      # - TELDRIVE_JWT_SESSION_TIME=30d
      #
      # Cookie 的 SameSite 策略，默认 lax（直接 IP:端口 访问用这个就行）
      # 如果你用反向代理 + HTTPS 域名访问，且经常从外部链接跳进来，
      # 可设为 none，能减少「刚从微信/TG 点进来就要重新登录」的情况
      # - TELDRIVE_JWT_COOKIE_SAMESITE=lax
      #
      # ================================================================
      #  登录闸门 —— 2.8.0 起
      # ================================================================
      # 作用：第一次打开网页时，用「扫码」或「手机验证码」登录一次 TG 账号；
      #       之后这台设备的浏览器直接进，不用再登。
      #
      # 为什么网址被别人拿到也用不了：
      #   放行需要同时满足两个条件 ——
      #     ① 服务端已绑定 TG 凭证（证明这个容器归你）
      #     ② 当前浏览器带着有效签名门票（证明这个浏览器是主人）
      #   只满足①，别人拿到网址照样是 401。
      #
      # 不看 Host、不分内外网、不认域名 —— 任何设备/服务器行为一致。
      #
      # 闸门数据文件路径（TG 主凭证 + 门票签名密钥），默认 /data/tgpan-gate.json
      # 注意：删掉这个文件 = 恢复出厂设置，需要重新登录一次 TG
      #
      # ⚠️ 如果你的配置目录不是 /data（比如挂在 /config），**必须**显式指定，
      #    否则闸门会读不到已有的凭证文件，当成全新部署、重新引导你登录。
      # - TELDRIVE_GATE_DATA_FILE=/data/tgpan-gate.json
      #
      # 想彻底关掉闸门（内网自用、不需要任何登录保护），设为 true
      # - TELDRIVE_GATE_DISABLE=false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
