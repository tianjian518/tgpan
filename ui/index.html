<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 手机浏览器的地址栏 / 状态栏配色，跟随系统深浅色，避免深色下顶出一条白边 -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e2126" media="(prefers-color-scheme: dark)" />
  <title>TGPan</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="/app.css?v=18" />
</head>

<body>
  <div id="app"></div>
  <!-- QR 编码库（qrcode-generator, MIT）。登录页扫码用，无外部依赖 -->
  <script src="/vendor-qrcode.js?v=18" defer></script>
  <!-- 登录引导：扫码 / 手机验证码（必须早于 app.js，用于遮罩） -->
  <script src="/tgpan-gate.js?v=18" defer></script>
  <!-- 主界面：我的网盘 + 系统设置 -->
  <script src="/app.js?v=18" defer></script>
</body>

</html>
